<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>911 Training</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root {
    --bg: #101014;
    --bg2: #18181e;
    --card: #1c1c24;
    --card2: #24242e;
    --card3: #2e2e3a;
    --accent: #6366f1;
    --accent-soft: rgba(99,102,241,0.12);
    --caller: #1e3a5f;
    --caller-border: #3b82f6;
    --caller-name: #60a5fa;
    --operator: #4f46e5;
    --operator-light: #818cf8;
    --green: #22c55e;
    --green-soft: rgba(34,197,94,0.12);
    --orange: #f59e0b;
    --red: #ef4444;
    --text: #f1f1f6;
    --text2: #c4c4d4;
    --muted: #71717a;
    --your-turn-bg: #1a1a2e;
    --your-turn-border: #4f46e5;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh; min-height: 100dvh;
    overflow-x: hidden;
  }

  .app {
    max-width: 540px;
    margin: 0 auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* === HEADER === */
  .header { text-align: center; padding: 10px 0 2px; }
  .header h1 {
    font-size: 1.4rem; font-weight: 800;
    color: var(--text);
    letter-spacing: -0.5px;
  }
  .header h1 span { color: var(--accent); }

  /* === PROGRESS === */
  .progress-wrap {
    background: var(--card);
    border-radius: 12px;
    padding: 10px 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .progress-wrap .label {
    font-size: 0.78rem; color: var(--text2);
    font-weight: 600; white-space: nowrap;
  }
  .progress-wrap .label b { color: var(--green); }
  .progress-bar {
    flex: 1; height: 6px;
    background: var(--bg); border-radius: 3px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; border-radius: 3px;
    background: var(--green);
    transition: width 0.4s ease; width: 0%;
  }

  /* === TABS === */
  .tabs {
    display: flex; gap: 4px;
    background: var(--card); border-radius: 12px; padding: 4px;
  }
  .tab {
    flex: 1; padding: 10px 4px; border: none;
    background: transparent; color: var(--muted);
    font-size: 0.76rem; font-weight: 600;
    border-radius: 8px; cursor: pointer;
    transition: all 0.2s; font-family: inherit;
  }
  .tab:hover { color: var(--text2); }
  .tab.active { background: var(--accent); color: #fff; }

  /* === FICHE GRID === */
  .fiches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .fiche-btn {
    position: relative;
    padding: 6px 4px;
    border: 1.5px solid var(--card2);
    background: var(--card);
    color: var(--muted);
    border-radius: 10px; cursor: pointer;
    font-size: 0.62rem; font-weight: 600;
    font-family: inherit;
    transition: all 0.15s;
    text-align: center;
    line-height: 1.25;
    display: flex; flex-direction: column;
    align-items: center; gap: 2px;
  }
  .fiche-btn .num {
    font-size: 0.82rem; font-weight: 800;
    color: var(--text2);
  }
  .fiche-btn .name {
    overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; width: 100%;
    padding: 0 2px;
  }
  .fiche-btn:hover { border-color: var(--accent); color: var(--text2); }
  .fiche-btn.current {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .fiche-btn.current .num { color: var(--accent); }
  .fiche-btn.done { border-color: rgba(34,197,94,0.25); }
  .fiche-btn.done .num { color: var(--green); }

  /* === OPTIONS === */
  .options-row {
    display: flex; align-items: center;
    justify-content: space-between; padding: 0 2px;
  }
  .tts-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.78rem; color: var(--muted);
    cursor: pointer; user-select: none;
  }
  .tts-label input { display: none; }
  .toggle {
    width: 36px; height: 20px;
    background: var(--card3); border-radius: 10px;
    position: relative; transition: background 0.2s;
  }
  .toggle::after {
    content:''; position: absolute;
    top: 3px; left: 3px;
    width: 14px; height: 14px;
    background: var(--muted); border-radius: 50%;
    transition: all 0.2s;
  }
  .tts-label input:checked + .toggle { background: var(--accent); }
  .tts-label input:checked + .toggle::after { left: 19px; background: #fff; }

  .timer-display {
    font-size: 1.1rem; font-weight: 700;
    color: var(--orange); font-variant-numeric: tabular-nums;
    display: none;
  }
  .conv-step {
    font-size: 0.82rem; color: var(--operator-light);
    font-weight: 700; display: none;
  }

  /* === MAIN CARD === */
  .main-card {
    background: var(--card);
    border-radius: 16px;
    padding: 18px;
    display: flex; flex-direction: column;
    min-height: 200px;
  }
  .card-head {
    display: flex; align-items: center;
    gap: 10px; margin-bottom: 16px;
  }
  .card-badge {
    background: var(--accent);
    color: #fff; font-size: 0.72rem;
    font-weight: 800; padding: 3px 9px;
    border-radius: 6px; flex-shrink: 0;
  }
  .card-title {
    font-size: 1rem; font-weight: 700;
    color: var(--text); letter-spacing: -0.3px;
  }
  .card-body {
    flex: 1; display: flex;
    flex-direction: column; gap: 10px;
    overflow-y: auto; max-height: 55vh;
    padding-right: 4px;
  }
  .card-body::-webkit-scrollbar { width: 4px; }
  .card-body::-webkit-scrollbar-track { background: transparent; }
  .card-body::-webkit-scrollbar-thumb { background: var(--card3); border-radius: 2px; }

  /* === BUBBLES === */
  .bubble {
    padding: 12px 16px;
    border-radius: 16px;
    line-height: 1.65;
    font-size: 0.92rem;
    animation: pop 0.25s ease;
    word-wrap: break-word;
    position: relative;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .bubble .who {
    display: flex; align-items: center; gap: 6px;
    font-size: 0.68rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.6px;
    margin-bottom: 6px;
  }
  .bubble .who .dot {
    width: 8px; height: 8px; border-radius: 50%;
    flex-shrink: 0;
  }

  /* -- Caller -- */
  .bubble-caller {
    background: var(--caller);
    color: #d4e6f9;
    border-bottom-left-radius: 5px;
    align-self: flex-start;
    max-width: 88%;
    border-left: 3px solid var(--caller-border);
  }
  .bubble-caller .who { color: var(--caller-name); }
  .bubble-caller .who .dot { background: var(--caller-border); }

  /* -- Operator -- */
  .bubble-operator {
    background: var(--operator);
    color: #fff;
    border-bottom-right-radius: 5px;
    align-self: flex-end;
    max-width: 88%;
    cursor: pointer;
  }
  .bubble-operator .who { color: rgba(255,255,255,0.55); }
  .bubble-operator .who .dot { background: rgba(255,255,255,0.5); }

  /* -- Hidden state -- */
  .bubble-operator.hidden-text {
    background: var(--your-turn-bg);
    border: 2px solid var(--your-turn-border);
    color: transparent;
    user-select: none;
    min-height: 70px;
    cursor: pointer;
    position: relative;
  }
  .bubble-operator.hidden-text .who { visibility: hidden; }
  .bubble-operator.hidden-text .hint-overlay {
    display: flex;
  }
  .hint-overlay {
    display: none;
    position: absolute;
    inset: 0;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 4px;
    pointer-events: none;
    overflow: hidden;
  }
  .hint-overlay .hint-icon {
    font-size: 1.3rem;
  }
  .hint-overlay .hint-text {
    color: var(--operator-light);
    font-size: 0.75rem;
    font-weight: 600;
    white-space: nowrap;
  }

  .bubble-operator.hidden-text:hover,
  .bubble-operator.hidden-text:active {
    background: var(--accent-soft);
    border-color: var(--operator-light);
  }

  /* -- Done -- */
  .bubble-done {
    background: var(--green);
    color: #fff; text-align: center;
    font-weight: 700; font-size: 1rem;
    align-self: center; padding: 20px 32px;
    border-radius: 16px;
  }

  /* -- Empty -- */
  .empty-state {
    flex: 1; display: flex;
    flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--muted); gap: 8px;
    text-align: center; padding: 30px;
  }
  .empty-state .icon { font-size: 2.5rem; }
  .empty-state p { font-size: 0.88rem; }

  /* === CONTROLS === */
  .controls { display: flex; gap: 7px; }
  .btn {
    flex: 1; padding: 14px 8px;
    border: none; border-radius: 12px;
    cursor: pointer; font-size: 0.8rem;
    font-weight: 700; font-family: inherit;
    transition: all 0.12s; text-align: center;
  }
  .btn:active { transform: scale(0.96); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-ghost { background: var(--card2); color: var(--text2); }
  .btn-ghost:hover { background: var(--card3); }
  .btn-green { background: var(--green); color: #fff; }
  .btn-orange { background: var(--orange); color: #fff; }

  /* === KEYBOARD === */
  .kb {
    text-align: center; font-size: 0.65rem;
    color: #3a3a44; padding: 6px 0;
  }
  .kb kbd {
    background: var(--card); color: var(--muted);
    padding: 2px 6px; border-radius: 4px;
    font-size: 0.6rem; font-weight: 600;
    font-family: inherit; border: 1px solid var(--card2);
  }

  /* === RESPONSIVE === */
  @media (max-width: 540px) {
    .app { padding: 8px; gap: 9px; }
    .header h1 { font-size: 1.2rem; }
    .fiches { gap: 4px; }
    .fiche-btn { font-size: 0.58rem; padding: 5px 2px; }
    .fiche-btn .num { font-size: 0.75rem; }
    .tab { font-size: 0.7rem; padding: 9px 3px; }
    .bubble { font-size: 0.88rem; padding: 11px 14px; max-width: 92% !important; }
    .btn { padding: 13px 6px; font-size: 0.76rem; }
    .main-card { padding: 14px; }
    .card-body { max-height: 50vh; }
    .kb { display: none; }
  }
  @media (max-width: 380px) {
    .fiches { grid-template-columns: repeat(5, 1fr); }
    .fiche-btn .name { display: none; }
    .header h1 { font-size: 1.05rem; }
    .bubble { font-size: 0.84rem; padding: 10px 12px; }
    .card-body { max-height: 45vh; }
  }
  @media (min-width: 768px) {
    .app { padding: 24px; gap: 16px; }
    .bubble { font-size: 0.95rem; }
    .card-body { max-height: 60vh; }
  }
</style>
</head>

<div class="app">

  <div class="header">
    <h1><span>911</span> Emergency Training</h1>
  </div>

  <div class="progress-wrap">
    <span class="label"><b id="scoreNum">0</b> / 15 maitrisees</span>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="tabs">
    <button class="tab active" id="modeClassic" onclick="setMode('practice')">Classique</button>
    <button class="tab" id="modeConv" onclick="setMode('conversation')">Conversation</button>
    <button class="tab" id="modeRandom" onclick="setMode('random')">Aleatoire</button>
    <button class="tab" id="modeTimed" onclick="setMode('timed')">Chrono</button>
  </div>

  <div class="fiches" id="ficheGrid"></div>

  <div class="options-row">
    <label class="tts-label">
      <input type="checkbox" id="ttsCheck" checked>
      <span class="toggle"></span>
      Voix anglaise
    </label>
    <span class="timer-display" id="timerDisplay">00:00</span>
    <span class="conv-step" id="convProgress"></span>
  </div>

  <div class="main-card">
    <div class="card-head" id="cardHead" style="display:none">
      <span class="card-badge" id="cardBadge"></span>
      <span class="card-title" id="cardTitle"></span>
    </div>
    <div class="card-body" id="cardBody">
      <div class="empty-state">
        <div class="icon">&#128222;</div>
        <p>Choisis une fiche pour demarrer</p>
      </div>
    </div>
  </div>

  <div class="controls" id="classicControls">
    <button class="btn btn-ghost" onclick="hideAll()">Cacher</button>
    <button class="btn btn-ghost" onclick="revealAll()">Reveler</button>
    <button class="btn btn-accent" onclick="nextR()">Aleatoire</button>
    <button class="btn btn-green" onclick="markD()">Maitrisee</button>
  </div>
  <div class="controls" id="convControls" style="display:none">
    <button class="btn btn-orange" id="convNextBtn" onclick="convN()">Suivant</button>
    <button class="btn btn-accent" onclick="nextR()">Aleatoire</button>
    <button class="btn btn-green" onclick="markD()">Maitrisee</button>
  </div>

  <div class="kb">
    <kbd>Espace</kbd> reveler/avancer
    <kbd>&larr;</kbd><kbd>&rarr;</kbd> fiches
    <kbd>M</kbd> maitrisee
    <kbd>R</kbd> aleatoire
    <kbd>T</kbd> voix
    <kbd>A</kbd> tout montrer
    <kbd>H</kbd> tout cacher
  </div>

</div>

const NAMES=F.map(f=>f.t);
let cur=-1,mode='practice',done=new Set();
let tI=null,tS=0,cP=[],cS=0,cR=false;

let spkAudio=null;
function speak(t){
  if(!document.getElementById('ttsCheck').checked)return;
  if(spkAudio){spkAudio.pause();spkAudio=null;}
  const url='https://translate.google.com/translate_tts?ie=UTF-8&tl=en&client=tw-ob&q='+encodeURIComponent(t);
  spkAudio=new Audio(url);
  spkAudio.play().catch(()=>{});
}

function setMode(m){
  mode=m;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  ({practice:'modeClassic',conversation:'modeConv',random:'modeRandom',timed:'modeTimed'})[m]&&document.getElementById(({practice:'modeClassic',conversation:'modeConv',random:'modeRandom',timed:'modeTimed'})[m]).classList.add('active');
  document.getElementById('classicControls').style.display=m==='conversation'?'none':'flex';
  document.getElementById('convControls').style.display=m==='conversation'?'flex':'none';
  document.getElementById('convProgress').style.display=m==='conversation'?'inline':'none';
  document.getElementById('timerDisplay').style.display=m==='timed'?'inline':'none';
  if(m!=='timed')stopT();
  if(m==='random')nextR();
  else if(cur>=0)loadF(cur);
}

function buildG(){
  const g=document.getElementById('ficheGrid');g.innerHTML='';
  F.forEach((f,i)=>{
    const b=document.createElement('button');
    b.className='fiche-btn'+(i===cur?' current':'')+(done.has(i)?' done':'');
    const short=NAMES[i].length>10?NAMES[i].substring(0,9)+'..':NAMES[i];
    b.innerHTML=`<span class="num">${i+1}</span><span class="name">${short}</span>`;
    b.title=NAMES[i];b.onclick=()=>loadF(i);
    g.appendChild(b);
  });
}

function mkBubble(role,text,hidden){
  const d=document.createElement('div');
  if(role==='O'){
    d.className='bubble bubble-operator'+(hidden?' hidden-text':'');
    d.innerHTML=`<div class="who"><span class="dot"></span>TOI - OPERATEUR</div><div class="txt">${text}</div><div class="hint-overlay"><span class="hint-icon">&#127908;</span><span class="hint-text">A toi ! Clique ou Espace</span></div>`;
    if(hidden) d.onclick=()=>{d.classList.remove('hidden-text');};
  } else {
    d.className='bubble bubble-caller';
    d.innerHTML=`<div class="who"><span class="dot"></span>APPELANT</div><div class="txt">${text}</div>`;
  }
  return d;
}

function loadF(i){
  cur=i;if(spkAudio){spkAudio.pause();spkAudio=null;};
  document.getElementById('cardHead').style.display='flex';
  document.getElementById('cardBadge').textContent=i+1;
  document.getElementById('cardTitle').textContent=NAMES[i];
  const c=document.getElementById('cardBody');c.innerHTML='';
  if(mode==='conversation')loadConv(F[i]);else loadCl(F[i]);
  buildG();if(mode==='timed')startT();
}

function loadCl(f){
  const c=document.getElementById('cardBody');
  f.l.forEach(line=>c.appendChild(mkBubble(line.r,line.x,line.r==='O')));
}

function loadConv(f){
  cP=[];cS=0;cR=false;
  let i=0;const L=f.l;
  while(i<L.length){
    if(L[i].r==='O'&&i===0){cP.push({c:null,o:L[i]});i++;}
    else if(L[i].r==='R'){
      const p={c:L[i],o:null};
      if(i+1<L.length&&L[i+1].r==='O'){p.o=L[i+1];i+=2;}else i++;
      cP.push(p);
    } else {cP.push({c:null,o:L[i]});i++;}
  }
  convR();
}

function convR(){
  const c=document.getElementById('cardBody');c.innerHTML='';
  if(cS>=cP.length){
    const d=document.createElement('div');d.className='bubble bubble-done';
    d.textContent='Dialogue termine !';c.appendChild(d);
    document.getElementById('convNextBtn').disabled=true;
    updCP();return;
  }
  const p=cP[cS];
  if(p.c){c.appendChild(mkBubble('R',p.c.x,false));speak(p.c.x);}
  if(p.o)c.appendChild(mkBubble('O',p.o.x,!cR));
  updCP();document.getElementById('convNextBtn').disabled=false;
}

function convN(){
  if(cS>=cP.length)return;
  if(!cR&&cP[cS].o){
    cR=true;const d=document.querySelector('.bubble-operator');
    if(d)d.classList.remove('hidden-text');
  } else {if(spkAudio){spkAudio.pause();spkAudio=null;};cS++;cR=false;convR();}
}

function updCP(){
  document.getElementById('convProgress').textContent=`${Math.min(cS+1,cP.length)} / ${cP.length}`;
}

function revealAll(){document.querySelectorAll('.bubble-operator.hidden-text').forEach(l=>l.classList.remove('hidden-text'));if(mode==='timed')stopT();}
function hideAll(){document.querySelectorAll('.bubble-operator').forEach(l=>l.classList.add('hidden-text'));if(mode==='timed')startT();}
function revealNext(){
  const h=document.querySelector('.bubble-operator.hidden-text');
  if(h){h.classList.remove('hidden-text');h.scrollIntoView({behavior:'smooth',block:'nearest'});}
}

function nextR(){
  let r=[];for(let i=0;i<F.length;i++)if(!done.has(i))r.push(i);
  if(!r.length){done.clear();for(let i=0;i<F.length;i++)r.push(i);updS();}
  loadF(r[Math.floor(Math.random()*r.length)]);
}

function markD(){
  if(cur<0)return;done.add(cur);updS();buildG();
}

function updS(){
  document.getElementById('scoreNum').textContent=done.size;
  document.getElementById('progressFill').style.width=Math.round(done.size/F.length*100)+'%';
}

function startT(){
  stopT();tS=0;const d=document.getElementById('timerDisplay');
  d.style.display='inline';d.textContent='00:00';
  tI=setInterval(()=>{tS++;d.textContent=String(Math.floor(tS/60)).padStart(2,'0')+':'+String(tS%60).padStart(2,'0');},1000);
}
function stopT(){if(tI){clearInterval(tI);tI=null;}}

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  switch(e.code){
    case'Space':e.preventDefault();mode==='conversation'?convN():revealNext();break;
    case'ArrowRight':e.preventDefault();if(cur<F.length-1)loadF(cur+1);break;
    case'ArrowLeft':e.preventDefault();if(cur>0)loadF(cur-1);break;
    case'KeyM':e.preventDefault();markD();break;
    case'KeyR':e.preventDefault();nextR();break;
    case'KeyT':e.preventDefault();const c=document.getElementById('ttsCheck');c.checked=!c.checked;break;
    case'KeyA':e.preventDefault();revealAll();break;
    case'KeyH':e.preventDefault();hideAll();break;
  }
});
buildG();
</script>
